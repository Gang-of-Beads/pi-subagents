name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Waits for the maintainer's approval on GitHub before anything is published.
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install devDependencies
        run: npm ci --ignore-scripts
      - name: Check the PI WEB half
        run: npm run check:web
      - name: Run tests
        run: npm run test:all
      - name: Build published package
        run: npm run build:pkg
      - name: Publish to npm
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./dist-pkg/package.json').name")"
          ver="$(node -p "require('./dist-pkg/package.json').version")"
          # A version can already be there from a manual publish, or from a re-run of this workflow.
          if npm view "$pkg@$ver" version >/dev/null 2>&1; then
            echo "$pkg@$ver is already on npm; skipping publish"
          else
            npm publish "./dist-pkg" --provenance
          fi
